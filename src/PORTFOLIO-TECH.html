<style>
:root {
  /* ─── Cor Principal ─── */
  --cor-primaria: #22D3A5;
  --cor-primaria-hover: #1BB88F;
  --cor-primaria-light: rgba(34,211,165,0.12);
  --cor-primaria-rgb: 34, 211, 165;
  --cor-primaria-gradient: linear-gradient(135deg, #22D3A5 0%, #38BDF8 100%);

  /* ─── Cor Secundária / Accent ─── */
  --cor-accent: #38BDF8;
  --cor-accent-light: rgba(56,189,248,0.12);
  --cor-accent-rgb: 56, 189, 248;

  /* ─── Fundos ─── */
  --cor-fundo: #0B0F19;
  --cor-fundo-alt: #0B0F19;
  --cor-fundo-hero: linear-gradient(160deg, #05070D 0%, #101B33 50%, #05070D 100%);
  --cor-fundo-card: #121826;
  --cor-fundo-escuro: #05070D;

  /* ─── Textos ─── */
  --cor-texto: #E2E8F0;
  --cor-texto-light: #94A3B8;
  --cor-texto-claro: #FFFFFF;
  --cor-texto-muted: #64748B;

  /* ─── Especiais ─── */
  --cor-whatsapp: #25D366;
  --cor-whatsapp-hover: #1EBE57;
  --cor-sucesso: #22D3A5;
  --cor-barra-fundo: #1E293B;
  --cor-link: #38BDF8;

  /* ─── Bordas e Sombras ─── */
  --cor-borda: #1E293B;
  --cor-borda-light: #172033;
  --sombra-sutil: 0 1px 3px rgba(0,0,0,0.3);
  --sombra-card: 0 8px 30px rgba(0,0,0,0.4);
  --sombra-card-hover: 0 16px 44px rgba(34,211,165,0.15);
  --sombra-foto: 0 8px 30px rgba(0,0,0,0.5);

  /* ─── Raios ─── */
  --raio: 12px;
  --raio-grande: 18px;
  --raio-botao: 8px;
  --raio-pill: 50px;
  --raio-foto: 20px;

  /* ─── Tipografia ─── */
  --fonte: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  --fonte-mono: 'JetBrains Mono', monospace;

  /* ─── Espaçamentos ─── */
  --secao-padding: 80px;
  --max-largura: 860px;
  --max-largura-larga: 1040px;

  /* ─── Transições ─── */
  --trans: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  /* ─── Barra de Habilidade ─── */
  --barra-altura: 8px;
  --barra-raio: 50px;
}

/* ─── RESET ─── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:var(--fonte);color:var(--cor-texto);
  background:var(--cor-fundo-alt);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
ul{list-style:none}
.mono{font-family:var(--fonte-mono)}

/* ─── NAVBAR ─── */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;transition:var(--trans);border-bottom:1px solid transparent}
.nav.solid{background:rgba(5,7,13,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--cor-borda)}
.nav-inner{max-width:var(--max-largura-larga);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
.nav-name{font-size:.95rem;font-weight:700;color:white;display:flex;align-items:center;gap:8px;font-family:var(--fonte-mono)}
.nav-name-dot{width:8px;height:8px;border-radius:50%;background:var(--cor-primaria);box-shadow:0 0 8px var(--cor-primaria)}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{color:var(--cor-texto-light);font-size:.8rem;font-weight:500;padding:8px 14px;border-radius:var(--raio-botao);transition:var(--trans);font-family:var(--fonte-mono)}
.nav-link:hover{color:var(--cor-primaria);background:var(--cor-primaria-light)}

// ─── NAVBAR ───
function Navbar() {
  const [solid, setSolid] = React.useState(false);
  React.useEffect(() => {
    const fn = () => setSolid(window.scrollY > 80);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  return (
    <nav className={`nav ${solid ? 'solid' : ''}`}>
      <div className="nav-inner">
        <div className="nav-name">
          <span className="nav-name-dot"></span>
          {CONFIG.pessoal.nome.split(' ')[0].toLowerCase()}.dev
        </div>
        <div className="nav-links">
          <a href="#sobre" className="nav-link">sobre</a>
          <a href="#projetos" className="nav-link">projetos</a>
          <a href="#experiencia" className="nav-link">experiência</a>
          <a href="#habilidades" className="nav-link">skills</a>
          <a href="#contato" className="nav-link">contato</a>
        </div>
        <a href="#contato" className="nav-cta">contato()</a>
      </div>
    </nav>
  );
}

// ─── HABILIDADES ───
function Habilidades() {
  const habs = CONFIG.habilidades;
  const [modo, setModo] = React.useState(CONFIG.habilidadesModoInicial || 'barras');
  const [animado, setAnimado] = React.useState(false);

  React.useEffect(() => {
    const obs = new IntersectionObserver(
      (entries) => { if (entries[0].isIntersecting) setAnimado(true); },
      { threshold: 0.2 }
    );
    const el = document.getElementById('habilidades');
    if (el) obs.observe(el);
    return () => obs.disconnect();
  }, []);

  if (!habs || habs.length === 0) return null;

  return (
    <section className="secao" id="habilidades" style={{paddingTop:0}}>
      <div className="main-container">
        <div className="secao-titulo">
          <span className="secao-titulo-label">// skills</span>
          <h2>Habilidades Técnicas</h2>
          <p>Stacks e ferramentas que utilizo no dia a dia</p>
        </div>

        <div className="hab-modos">
          <button className={`hab-modo-btn ${modo === 'barras' ? 'active' : ''}`} onClick={() => setModo('barras')}>barras</button>
          <button className={`hab-modo-btn ${modo === 'tags' ? 'active' : ''}`} onClick={() => setModo('tags')}>tags</button>
        </div>

        {modo === 'barras' ? (
          <div className="hab-barras">
            {habs.map((h, i) => (
              <div className="hab-barra-item" key={i}>
                <div className="hab-barra-header">
                  <span className="hab-barra-nome">{h.icone} {h.nome}</span>
                  <span className="hab-barra-pct">{h.nivel}%</span>
                </div>
                <div className="hab-barra-track">
                  <div className="hab-barra-fill" style={{ width: animado ? `${h.nivel}%` : '0%' }}></div>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div className="hab-tags">
            {habs.map((h, i) => (
              <span className="hab-tag" key={i}>
                <span className="hab-tag-icon">{h.icone}</span>
                {h.nome}
                <span className="hab-tag-nivel">{h.nivelTexto}</span>
              </span>
            ))}
          </div>
        )}

        <div className="secao-divider" style={{marginTop:'var(--secao-padding)'}}></div>
      </div>
    </section>
  );
}

// ─── FOOTER ───
function Footer() {
  const ano = new Date().getFullYear();
  const p = CONFIG.pessoal;
  const redes = [
    { url: p.linkedin, icone: '💼', label: 'LinkedIn' },
    { url: p.github, icone: '💻', label: 'GitHub' },
    { url: p.instagram, icone: '📸', label: 'Instagram' },
  ];
  const temRedes = redes.some(r => r.url);

  return (
    <footer className="footer">
      {temRedes && (
        <div className="footer-social">
          {redes.map((r, i) => {
            if (!r.url) return null;
            return (
              <a key={i} href={r.url} target="_blank" rel="noopener noreferrer" title={r.label}>
                {r.icone}
              </a>
            );
          })}
        </div>
      )}
      <p className="mono">© {ano} <a href="#inicio">{p.nome}</a></p>
      <p style={{marginTop:'4px',fontSize:'.72rem',opacity:.6}} className="mono">
        {p.profissao}
      </p>
    </footer>
  );
}

// ─── WPP FLUTUANTE ───
function WppFloat() {
  const [show, setShow] = React.useState(false);
  React.useEffect(() => {
    const t = setTimeout(() => setShow(true), 2500);
    return () => clearTimeout(t);
  }, []);
  if (!show) return null;

  return (
    <div className="wpp-float">
      <div className="wpp-float-msg">$ fale_comigo</div>
      <a href={getWppLink()} target="_blank" rel="noopener noreferrer" className="wpp-float-btn" aria-label="WhatsApp">
        📱
      </a>
    </div>
  );
}

      <Contato />
      <Footer />

}
