<style>
:root {
  /* ─── Cor Principal ─── */
  --cor-primaria: #4FA88A;
  --cor-primaria-hover: #3F9078;
  --cor-primaria-light: #E9F5F0;
  --cor-primaria-rgb: 79, 168, 138;
  --cor-primaria-gradient: linear-gradient(135deg, #4FA88A 0%, #7BC4A8 100%);

  /* ─── Cor Secundária / Accent ─── */
  --cor-accent: #F4A672;
  --cor-accent-light: #FDF0E6;
  --cor-accent-rgb: 244, 166, 114;

  /* ─── Fundos ─── */
  --cor-fundo: #FFFFFF;
  --cor-fundo-alt: #FBFAF6;
  --cor-fundo-hero: linear-gradient(160deg, #EAF5EF 0%, #F7F2E8 100%);
  --cor-fundo-card: #FFFFFF;
  --cor-fundo-escuro: #2C3B35;

  /* ─── Textos ─── */
  --cor-texto: #2C3B35;
  --cor-texto-light: #6E7D74;
  --cor-texto-claro: #2C3B35;
  --cor-texto-muted: #A3AFA8;

  /* ─── Especiais ─── */
  --cor-whatsapp: #25D366;
  --cor-whatsapp-hover: #1EBE57;
  --cor-sucesso: #4FA88A;
  --cor-barra-fundo: #E3EFE9;
  --cor-link: #4FA88A;

  /* ─── Bordas e Sombras ─── */
  --cor-borda: #E7EFE9;
  --cor-borda-light: #F1F6F2;
  --sombra-sutil: 0 2px 8px rgba(79,168,138,0.06);
  --sombra-card: 0 8px 28px rgba(79,168,138,0.10);
  --sombra-card-hover: 0 16px 40px rgba(79,168,138,0.16);
  --sombra-foto: 0 8px 30px rgba(44,59,53,0.18);

  /* ─── Raios ─── */
  --raio: 20px;
  --raio-grande: 32px;
  --raio-botao: 16px;
  --raio-pill: 50px;
  --raio-foto: 50%;

  /* ─── Tipografia ─── */
  --fonte: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  --fonte-titulo: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;

  /* ─── Espaçamentos ─── */
  --secao-padding: 84px;
  --max-largura: 860px;
  --max-largura-larga: 1040px;

  /* ─── Transições ─── */
  --trans: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  /* ─── Barra de Habilidade ─── */
  --barra-altura: 10px;
  --barra-raio: 50px;
}

/* ─── RESET ─── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:var(--fonte);color:var(--cor-texto);
  background:var(--cor-fundo-alt);line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
ul{list-style:none}
h1,h2{font-family:var(--fonte-titulo)}

/* ─── NAVBAR ─── */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;transition:var(--trans)}
.nav.solid{background:rgba(255,255,255,0.94);backdrop-filter:blur(14px);box-shadow:0 2px 20px rgba(79,168,138,0.08)}
.nav-inner{max-width:var(--max-largura-larga);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
.nav-name{font-family:var(--fonte-titulo);font-size:1rem;font-weight:700;color:var(--cor-texto);display:flex;align-items:center;gap:8px}
.nav-name-dot{width:8px;height:8px;border-radius:50%;background:var(--cor-primaria)}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{color:var(--cor-texto-light);font-size:.82rem;font-weight:600;padding:8px 14px;border-radius:var(--raio-pill);transition:var(--trans)}
.nav-link:hover{color:var(--cor-primaria);background:var(--cor-primaria-light)}
.nav-cta{display:flex;align-items:center;gap:6px;background:var(--cor-primaria);color:white;padding:10px 22px;border-radius:var(--raio-pill);font-weight:700;font-size:.82rem;transition:var(--trans);border:none;cursor:pointer}
.nav-cta:hover{background:var(--cor-primaria-hover);transform:scale(1.03)}

/* ─── HERO ─── */
.hero{background:var(--cor-fundo-hero);padding:130px 24px 80px;text-align:center;color:var(--cor-texto);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:
    radial-gradient(circle at 20% 20%, rgba(79,168,138,0.10) 0%, transparent 55%),
    radial-gradient(circle at 80% 75%, rgba(244,166,114,0.12) 0%, transparent 55%)}
.hero-inner{position:relative;z-index:1;max-width:var(--max-largura);margin:0 auto}

.hero-foto-wrap{width:160px;height:160px;border-radius:var(--raio-foto);margin:0 auto 28px;position:relative}
.hero-foto-ring{position:absolute;inset:-6px;border-radius:var(--raio-foto);background:var(--cor-primaria-gradient);padding:4px}
.hero-foto-ring-inner{width:100%;height:100%;border-radius:var(--raio-foto);background:var(--cor-fundo-alt)}
.hero-foto{width:160px;height:160px;border-radius:var(--raio-foto);overflow:hidden;position:relative;z-index:1;box-shadow:var(--sombra-foto);background:var(--cor-primaria-light)}
.hero-foto img{width:100%;height:100%;object-fit:cover}
.hero-foto-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cor-primaria);gap:6px;background:var(--cor-primaria-light)}
.hero-foto-placeholder-icon{font-size:3.5rem}
.hero-foto-placeholder-text{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--cor-texto-muted)}

.hero-status{display:inline-flex;align-items:center;gap:8px;background:rgba(79,168,138,0.14);border:1px solid rgba(79,168,138,0.3);padding:6px 16px;border-radius:var(--raio-pill);font-size:.72rem;font-weight:700;color:var(--cor-primaria-hover);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:20px}
.hero-status-dot{width:7px;height:7px;background:var(--cor-primaria);border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.hero-nome{font-size:2.7rem;font-weight:700;line-height:1.15;margin-bottom:10px;color:var(--cor-texto)}
.hero-profissao{font-size:1.15rem;font-weight:600;color:var(--cor-primaria-hover);margin-bottom:14px}
.hero-objetivo{font-size:1rem;color:var(--cor-texto-light);max-width:480px;margin:0 auto 32px;line-height:1.8}

.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--cor-primaria-gradient);color:white;padding:15px 32px;border-radius:var(--raio-botao);font-size:.92rem;font-weight:700;border:none;cursor:pointer;transition:var(--trans);box-shadow:0 6px 20px rgba(79,168,138,0.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(79,168,138,0.4)}
.btn-wpp{display:inline-flex;align-items:center;gap:8px;background:var(--cor-whatsapp);color:white;padding:15px 32px;border-radius:var(--raio-botao);font-size:.92rem;font-weight:700;border:none;cursor:pointer;transition:var(--trans);box-shadow:0 4px 15px rgba(37,211,102,0.3)}
.btn-wpp:hover{background:var(--cor-whatsapp-hover);transform:translateY(-2px)}
.btn-outline-light{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--cor-texto);padding:15px 32px;border-radius:var(--raio-botao);font-size:.92rem;font-weight:700;border:2px solid rgba(79,168,138,0.3);cursor:pointer;transition:var(--trans)}
.btn-outline-light:hover{border-color:var(--cor-primaria);background:var(--cor-primaria-light)}
.btn-download{display:inline-flex;align-items:center;gap:8px;background:white;color:var(--cor-texto);padding:15px 32px;border-radius:var(--raio-botao);font-size:.92rem;font-weight:700;border:2px solid var(--cor-borda);cursor:pointer;transition:var(--trans)}
.btn-download:hover{border-color:var(--cor-primaria);color:var(--cor-primaria)}

.hero-info-bar{display:flex;justify-content:center;gap:40px;margin-top:40px;padding-top:28px;border-top:1px solid rgba(79,168,138,0.2)}
.hero-info-item{text-align:center}
.hero-info-valor{font-family:var(--fonte-titulo);font-size:1.5rem;font-weight:700;color:var(--cor-primaria-hover);line-height:1}
.hero-info-label{font-size:.7rem;color:var(--cor-texto-muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}

/* ─── CONTAINER ─── */
.main-container{max-width:var(--max-largura);margin:0 auto;padding:0 24px;position:relative}

/* ─── SEÇÕES ─── */
.secao{padding:var(--secao-padding) 0}
.secao-titulo{margin-bottom:36px;text-align:center}
.secao-titulo-label{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--cor-primaria-hover);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;background:var(--cor-primaria-light);padding:5px 14px;border-radius:var(--raio-pill)}
.secao-titulo h2{font-size:1.8rem;font-weight:700;color:var(--cor-texto);line-height:1.2}
.secao-titulo p{font-size:.92rem;color:var(--cor-texto-light);margin-top:6px}
.secao-divider{width:100%;height:1px;background:var(--cor-borda)}

/* ─── SOBRE ─── */
.sobre-card{background:var(--cor-fundo-card);border-radius:var(--raio-grande);padding:36px;box-shadow:var(--sombra-card);border:1px solid var(--cor-borda-light);text-align:center}
.sobre-texto{font-size:.96rem;color:var(--cor-texto-light);line-height:1.9;margin-bottom:26px}
.sobre-destaques{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.sobre-destaque{display:inline-flex;align-items:center;gap:8px;background:var(--cor-fundo-alt);border:1px solid var(--cor-borda);padding:10px 18px;border-radius:var(--raio-pill);font-size:.82rem;font-weight:700;color:var(--cor-texto);transition:var(--trans)}
.sobre-destaque:hover{border-color:var(--cor-primaria);background:var(--cor-primaria-light);color:var(--cor-primaria-hover)}
.sobre-destaque-icon{font-size:1.1rem}

/* ─── SERVIÇOS ─── */
.servicos-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.servico-card{background:var(--cor-fundo-card);border-radius:var(--raio-grande);padding:30px;box-shadow:var(--sombra-sutil);border:1px solid var(--cor-borda-light);transition:var(--trans)}
.servico-card:hover{box-shadow:var(--sombra-card-hover);transform:translateY(-4px);border-color:rgba(79,168,138,0.25)}
.servico-icone{width:56px;height:56px;border-radius:var(--raio-botao);background:var(--cor-primaria-light);display:flex;align-items:center;justify-content:center;font-size:1.7rem;margin-bottom:16px}
.servico-titulo{font-family:var(--fonte-titulo);font-size:1.08rem;font-weight:700;color:var(--cor-texto);margin-bottom:10px}
.servico-desc{font-size:.86rem;color:var(--cor-texto-light);line-height:1.75;margin-bottom:14px}
.servico-preco{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--cor-primaria-hover);background:var(--cor-primaria-light);padding:6px 16px;border-radius:var(--raio-pill)}

/* ─── EXPERIÊNCIA ─── */
.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--cor-borda)}
.timeline-item{position:relative;margin-bottom:28px}
.timeline-item:last-child{margin-bottom:0}
.timeline-dot{position:absolute;left:-32px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--cor-primaria-light);border:3px solid var(--cor-primaria);z-index:1;transition:var(--trans)}
.timeline-item:hover .timeline-dot{background:var(--cor-primaria);box-shadow:0 0 0 5px var(--cor-primaria-light)}
.timeline-card{background:var(--cor-fundo-card);border-radius:var(--raio);padding:24px 28px;box-shadow:var(--sombra-sutil);border:1px solid var(--cor-borda-light);transition:var(--trans)}
.timeline-card:hover{box-shadow:var(--sombra-card);transform:translateX(4px)}
.timeline-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.timeline-cargo{font-family:var(--fonte-titulo);font-size:1.05rem;font-weight:700;color:var(--cor-texto)}
.timeline-periodo{font-size:.75rem;font-weight:700;color:var(--cor-primaria-hover);background:var(--cor-primaria-light);padding:4px 12px;border-radius:var(--raio-pill);white-space:nowrap}
.timeline-empresa{font-size:.88rem;font-weight:600;color:var(--cor-texto-light);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.timeline-empresa-icon{font-size:1rem}
.timeline-desc{font-size:.85rem;color:var(--cor-texto-light);line-height:1.75}
.timeline-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.timeline-tag{font-size:.7rem;font-weight:600;background:var(--cor-fundo-alt);color:var(--cor-texto-muted);padding:4px 10px;border-radius:var(--raio-pill);border:1px solid var(--cor-borda)}

/* ─── FORMAÇÃO ─── */
.formacao-grid{display:flex;flex-direction:column;gap:16px}
.formacao-card{display:flex;align-items:center;gap:20px;background:var(--cor-fundo-card);border-radius:var(--raio);padding:24px;box-shadow:var(--sombra-sutil);border:1px solid var(--cor-borda-light);transition:var(--trans)}
.formacao-card:hover{box-shadow:var(--sombra-card)}
.formacao-icone{width:56px;height:56px;border-radius:14px;background:var(--cor-primaria-light);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
.formacao-info{flex:1}
.formacao-curso{font-family:var(--fonte-titulo);font-size:1rem;font-weight:700;color:var(--cor-texto);margin-bottom:2px}
.formacao-instituicao{font-size:.85rem;color:var(--cor-texto-light);display:flex;align-items:center;gap:4px}
.formacao-ano{font-size:.75rem;font-weight:700;color:var(--cor-primaria-hover);background:var(--cor-primaria-light);padding:4px 12px;border-radius:var(--raio-pill);white-space:nowrap;flex-shrink:0}

/* ─── HABILIDADES ─── */
.hab-modos{display:flex;gap:8px;margin-bottom:24px;justify-content:center}
.hab-modo-btn{padding:8px 18px;border-radius:var(--raio-pill);font-size:.8rem;font-weight:700;border:2px solid var(--cor-borda);background:transparent;color:var(--cor-texto-light);cursor:pointer;transition:var(--trans)}
.hab-modo-btn.active{background:var(--cor-primaria);color:white;border-color:var(--cor-primaria)}
.hab-modo-btn:hover:not(.active){border-color:var(--cor-primaria);color:var(--cor-primaria-hover)}
.hab-barras{display:flex;flex-direction:column;gap:18px}
.hab-barra-item{background:var(--cor-fundo-card);border-radius:var(--raio);padding:18px 22px;box-shadow:var(--sombra-sutil);border:1px solid var(--cor-borda-light)}
.hab-barra-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hab-barra-nome{font-size:.9rem;font-weight:700;color:var(--cor-texto)}
.hab-barra-pct{font-size:.8rem;font-weight:800;color:var(--cor-primaria-hover)}
.hab-barra-track{width:100%;height:var(--barra-altura);background:var(--cor-barra-fundo);border-radius:var(--barra-raio);overflow:hidden}
.hab-barra-fill{height:100%;border-radius:var(--barra-raio);background:var(--cor-primaria-gradient);transition:width 1.2s cubic-bezier(0.4,0,0.2,1)}
.hab-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.hab-tag{display:inline-flex;align-items:center;gap:8px;background:var(--cor-fundo-card);border:2px solid var(--cor-borda);padding:12px 20px;border-radius:var(--raio-pill);font-size:.85rem;font-weight:700;color:var(--cor-texto);transition:var(--trans);cursor:default}
.hab-tag:hover{border-color:var(--cor-primaria);background:var(--cor-primaria-light);color:var(--cor-primaria-hover)}
.hab-tag-icon{font-size:1.1rem}
.hab-tag-nivel{font-size:.65rem;font-weight:800;background:var(--cor-primaria-light);color:var(--cor-primaria-hover);padding:3px 8px;border-radius:var(--raio-pill)}

/* ─── CONTATO ─── */
.contato-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.contato-card{display:flex;align-items:center;gap:16px;background:var(--cor-fundo-card);border-radius:var(--raio);padding:22px;box-shadow:var(--sombra-sutil);border:1px solid var(--cor-borda-light);transition:var(--trans)}
.contato-card:hover{box-shadow:var(--sombra-card)}
.contato-card-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.contato-card-icon.wpp{background:rgba(37,211,102,0.12)}
.contato-card-icon.tel{background:var(--cor-primaria-light)}
.contato-card-icon.email{background:var(--cor-accent-light)}
.contato-card-icon.local{background:#F3EEE0}
.contato-label{font-size:.7rem;color:var(--cor-texto-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.contato-valor{font-size:.92rem;font-weight:700;color:var(--cor-texto)}
.contato-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ─── FOOTER ─── */
.footer{background:var(--cor-fundo-escuro);color:rgba(255,255,255,0.6);text-align:center;padding:44px 24px 32px;font-size:.82rem}
.footer a{color:#9BD6BE;font-weight:700}
.footer-social{display:flex;justify-content:center;gap:14px;margin-bottom:18px}
.footer-social a{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:var(--trans)}
.footer-social a:hover{background:var(--cor-primaria);transform:translateY(-3px)}

/* ─── WHATSAPP FLUTUANTE ─── */
.wpp-float{position:fixed;bottom:24px;right:24px;z-index:900;display:flex;align-items:center;gap:10px}
.wpp-float-msg{background:white;color:var(--cor-texto);padding:10px 16px;border-radius:var(--raio-pill);font-size:.8rem;font-weight:700;box-shadow:var(--sombra-card);white-space:nowrap;animation:float-in .4s ease}
@keyframes float-in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
.wpp-float-btn{width:58px;height:58px;border-radius:50%;background:var(--cor-whatsapp);display:flex;align-items:center;justify-content:center;font-size:1.7rem;box-shadow:0 6px 20px rgba(37,211,102,0.5);transition:var(--trans);flex-shrink:0}
.wpp-float-btn:hover{background:var(--cor-whatsapp-hover);transform:scale(1.08)}

/* ─── RESPONSIVO ─── */
@media (max-width:640px){
  .hero-nome{font-size:2.1rem}
  .contato-grid,.servicos-grid{grid-template-columns:1fr}
  .nav-links{display:none}
  .hero-info-bar{gap:24px}
  .secao{padding:56px 0}
}
</style>
</head>

  return `https://wa.me/${CONFIG.pessoal.whatsapp}?text=${encodeURIComponent(CONFIG.pessoal.whatsappMensagem)}`;

// ─── NAVBAR ───
function Navbar() {
  const [solid, setSolid] = React.useState(false);
  React.useEffect(() => {
    const fn = () => setSolid(window.scrollY > 80);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);

    <nav className={`nav ${solid ? 'solid' : ''}`}>

// ─── HABILIDADES ───
function Habilidades() {
  const habs = CONFIG.habilidades;
  const [modo, setModo] = React.useState(CONFIG.habilidadesModoInicial || 'barras');
  const [animado, setAnimado] = React.useState(false);

  React.useEffect(() => {
    const obs = new IntersectionObserver(
      (entries) => { if (entries[0].isIntersecting) setAnimado(true); },
      { threshold: 0.2 }
    );
    const el = document.getElementById('habilidades');
    if (el) obs.observe(el);
    return () => obs.disconnect();
  }, []);

  if (!habs || habs.length === 0) return null;

  return (
    <section className="secao" id="habilidades" style={{paddingTop:0}}>
      <div className="main-container">
        <div className="secao-titulo">
          <span className="secao-titulo-label">⭐ Especialidades</span>
          <h2>Áreas de Atuação</h2>
          <p>Onde posso te apoiar melhor</p>
        </div>

        <div className="hab-modos">
          <button className={`hab-modo-btn ${modo === 'barras' ? 'active' : ''}`} onClick={() => setModo('barras')}>📊 Barras</button>
          <button className={`hab-modo-btn ${modo === 'tags' ? 'active' : ''}`} onClick={() => setModo('tags')}>🏷️ Tags</button>
        </div>

        {modo === 'barras' ? (
          <div className="hab-barras">
            {habs.map((h, i) => (
              <div className="hab-barra-item" key={i}>
                <div className="hab-barra-header">
                  <span className="hab-barra-nome">{h.icone} {h.nome}</span>
                  <span className="hab-barra-pct">{h.nivel}%</span>
                </div>
                <div className="hab-barra-track">
                  <div className="hab-barra-fill" style={{ width: animado ? `${h.nivel}%` : '0%' }}></div>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div className="hab-tags">
            {habs.map((h, i) => (
              <span className="hab-tag" key={i}>
                <span className="hab-tag-icon">{h.icone}</span>
                {h.nome}
                <span className="hab-tag-nivel">{h.nivelTexto}</span>
              </span>
            ))}
          </div>
        )}

        <div className="secao-divider" style={{marginTop:'var(--secao-padding)'}}></div>
      </div>
    </section>
  );
}

// ─── FOOTER ───
function Footer() {
  const ano = new Date().getFullYear();
  const p = CONFIG.pessoal;
  const redes = [
    { url: p.linkedin, icone: '💼', label: 'LinkedIn' },
    { url: p.github, icone: '💻', label: 'GitHub' },
    { url: p.instagram, icone: '📸', label: 'Instagram' },
  ];
  const temRedes = redes.some(r => r.url);

  return (
    <footer className="footer">
      {temRedes && (
        <div className="footer-social">
          {redes.map((r, i) => {
            if (!r.url) return null;
            return (
              <a key={i} href={r.url} target="_blank" rel="noopener noreferrer" title={r.label}>
                {r.icone}
              </a>
            );
          })}
        </div>
      )}
      <p>© {ano} <a href="#inicio">{p.nome}</a></p>
      <p style={{marginTop:'4px',fontSize:'.72rem',opacity:.5}}>
        Portfólio online • {p.profissao}
      </p>
    </footer>
  );
}

// ─── WPP FLUTUANTE ───
function WppFloat() {
  const [show, setShow] = React.useState(false);
  React.useEffect(() => {
    const t = setTimeout(() => setShow(true), 2500);
    return () => clearTimeout(t);
  }, []);
  if (!show) return null;

  return (
    <div className="wpp-float">
      <div className="wpp-float-msg">💬 Agende sua consulta!</div>
      <a href={getWppLink()} target="_blank" rel="noopener noreferrer" className="wpp-float-btn" aria-label="WhatsApp">
        📱
      </a>
    </div>
  );
}

function App() {

      <Sobre />
      <Servicos />
      <Experiencia />
      <Formacao />
      <Habilidades />
      <Contato />
      <Footer />
      <WppFloat />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
