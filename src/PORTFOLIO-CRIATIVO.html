<style>
:root {
  /* ─── Cor Principal ─── */
  --cor-primaria: #FF6B6B;
  --cor-primaria-hover: #FF5252;
  --cor-primaria-light: #FFF0EE;
  --cor-primaria-rgb: 255, 107, 107;
  --cor-primaria-gradient: linear-gradient(135deg, #FF6B6B 0%, #A855F7 100%);

  /* ─── Cor Secundária / Accent ─── */
  --cor-accent: #FFD166;
  --cor-accent-light: #FFF9E6;
  --cor-accent-rgb: 255, 209, 102;

  /* ─── Fundos ─── */
  --cor-fundo: #FFFFFF;
  --cor-fundo-alt: #FFF8F6;
  --cor-fundo-hero: linear-gradient(160deg, #2D1B4E 0%, #5B2A86 50%, #2D1B4E 100%);
  --cor-fundo-card: #FFFFFF;
  --cor-fundo-escuro: #2D1B4E;

  /* ─── Textos ─── */
  --cor-texto: #2D1B3D;
  --cor-texto-light: #6B5B73;
  --cor-texto-claro: #FFFFFF;
  --cor-texto-muted: #A896AD;

  /* ─── Especiais ─── */
  --cor-whatsapp: #25D366;
  --cor-whatsapp-hover: #1EBE57;
  --cor-sucesso: #10B981;
  --cor-barra-fundo: #F3E8FF;
  --cor-link: #FF6B6B;

  /* ─── Bordas e Sombras ─── */
  --cor-borda: #F0E4F5;
  --cor-borda-light: #F8F1FA;
  --sombra-sutil: 0 1px 3px rgba(45,27,61,0.06);
  --sombra-card: 0 4px 24px rgba(168,85,247,0.10);
  --sombra-card-hover: 0 16px 44px rgba(168,85,247,0.18);
  --sombra-foto: 0 8px 30px rgba(0,0,0,0.35);

  /* ─── Raios ─── */
  --raio: 16px;
  --raio-grande: 28px;
  --raio-botao: 14px;
  --raio-pill: 50px;
  --raio-foto: 50%;

  /* ─── Tipografia ─── */
  --fonte: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;

  /* ─── Espaçamentos ─── */
  --secao-padding: 80px;
  --max-largura: 860px;
  --max-largura-larga: 1040px;

  /* ─── Transições ─── */
  --trans: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  /* ─── Barra de Habilidade ─── */
  --barra-altura: 10px;
  --barra-raio: 50px;
}

/* ─── RESET ─── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:var(--fonte);color:var(--cor-texto);
  background:var(--cor-fundo-alt);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
ul{list-style:none}

/* ─── NAVBAR ─── */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;transition:var(--trans)}
.nav.solid{background:rgba(45,27,78,0.92);backdrop-filter:blur(14px);box-shadow:0 2px 20px rgba(0,0,0,0.15)}
.nav-inner{max-width:var(--max-largura-larga);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
.nav-name{font-size:.95rem;font-weight:800;color:white;display:flex;align-items:center;gap:8px}
.nav-name-dot{width:8px;height:8px;border-radius:50%;background:var(--cor-accent)}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{color:rgba(255,255,255,0.65);font-size:.8rem;font-weight:600;padding:8px 14px;border-radius:var(--raio-botao);transition:var(--trans)}
.nav-link:hover{color:white;background:rgba(255,255,255,0.1)}
.nav-cta{display:flex;align-items:center;gap:6px;background:var(--cor-primaria-gradient);color:white;padding:9px 20px;border-radius:var(--raio-botao);font-weight:700;font-size:.8rem;transition:var(--trans);border:none;cursor:pointer}
.nav-cta:hover{transform:scale(1.05)}

/* ─── HERO ─── */
.hero{background:var(--cor-fundo-hero);padding:130px 24px 80px;text-align:center;color:var(--cor-texto-claro);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:
    radial-gradient(circle at 25% 20%, rgba(255,107,107,0.20) 0%, transparent 50%),
    radial-gradient(circle at 75% 80%, rgba(255,209,102,0.14) 0%, transparent 50%)}
.hero-inner{position:relative;z-index:1;max-width:var(--max-largura);margin:0 auto}

.hero-foto-wrap{width:168px;height:168px;border-radius:var(--raio-foto);margin:0 auto 28px;position:relative}
.hero-foto-ring{position:absolute;inset:-6px;border-radius:var(--raio-foto);background:var(--cor-primaria-gradient);padding:4px;animation:ring-rotate 8s linear infinite}
@keyframes ring-rotate{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
.hero-foto-ring-inner{width:100%;height:100%;border-radius:var(--raio-foto);background:var(--cor-fundo-escuro)}
.hero-foto{width:168px;height:168px;border-radius:var(--raio-foto);overflow:hidden;position:relative;z-index:1;box-shadow:var(--sombra-foto);background:var(--cor-primaria-light)}
.hero-foto img{width:100%;height:100%;object-fit:cover}
.hero-foto-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cor-primaria);gap:6px;background:var(--cor-primaria-light)}
.hero-foto-placeholder-icon{font-size:3.5rem}
.hero-foto-placeholder-text{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--cor-texto-muted)}

.hero-status{display:inline-flex;align-items:center;gap:8px;background:rgba(16,185,129,0.18);border:1px solid rgba(16,185,129,0.3);padding:6px 16px;border-radius:var(--raio-pill);font-size:.72rem;font-weight:700;color:#34D399;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:20px}
.hero-status-dot{width:7px;height:7px;background:#34D399;border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.hero-nome{font-size:2.9rem;font-weight:900;line-height:1.1;margin-bottom:10px}
.hero-profissao{font-size:1.2rem;font-weight:600;background:linear-gradient(135deg,#FF9E7D,#FFD166);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.hero-objetivo{font-size:1rem;color:rgba(255,255,255,0.6);max-width:500px;margin:0 auto 32px;line-height:1.7}

.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--cor-primaria-gradient);color:white;padding:15px 32px;border-radius:var(--raio-botao);font-size:.92rem;font-weight:700;border:none;cursor:pointer;transition:var(--trans);box-shadow:0 6px 20px rgba(255,107,107,0.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,107,107,0.5)}
.btn-wpp{display:inline-flex;align-items:center;gap:8px;background:var(--cor-whatsapp);color:white;padding:15px 32px;border-radius:var(--raio-botao);font-size:.92rem;font-weight:700;border:none;cursor:pointer;transition:var(--trans);box-shadow:0 4px 15px rgba(37,211,102,0.35)}
.btn-wpp:hover{background:var(--cor-whatsapp-hover);transform:translateY(-2px);box-shadow:0 8px 25px rgba(37,211,102,0.45)}
.btn-outline-light{display:inline-flex;align-items:center;gap:8px;background:transparent;color:white;padding:15px 32px;border-radius:var(--raio-botao);font-size:.92rem;font-weight:700;border:2px solid rgba(255,255,255,0.25);cursor:pointer;transition:var(--trans)}
.btn-outline-light:hover{border-color:var(--cor-accent);background:rgba(255,209,102,0.1)}
.btn-download{display:inline-flex;align-items:center;gap:8px;background:var(--cor-fundo-card);color:var(--cor-texto);padding:15px 32px;border-radius:var(--raio-botao);font-size:.92rem;font-weight:700;border:2px solid var(--cor-borda);cursor:pointer;transition:var(--trans)}
.btn-download:hover{border-color:var(--cor-primaria);color:var(--cor-primaria)}

.hero-info-bar{display:flex;justify-content:center;gap:40px;margin-top:40px;padding-top:28px;border-top:1px solid rgba(255,255,255,0.1)}
.hero-info-item{text-align:center}
.hero-info-valor{font-size:1.5rem;font-weight:900;color:white;line-height:1}
.hero-info-label{font-size:.7rem;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:1px;margin-top:4px}

/* ─── CONTAINER ─── */
.main-container{max-width:var(--max-largura);margin:0 auto;padding:0 24px;position:relative}

/* ─── SEÇÕES ─── */
.secao{padding:var(--secao-padding) 0}
.secao-titulo{margin-bottom:36px}
.secao-titulo-label{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--cor-primaria);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;background:var(--cor-primaria-light);padding:5px 14px;border-radius:var(--raio-pill)}
.secao-titulo h2{font-size:1.8rem;font-weight:900;color:var(--cor-texto);line-height:1.2}
.secao-titulo p{font-size:.92rem;color:var(--cor-texto-light);margin-top:6px}
.secao-divider{width:100%;height:1px;background:var(--cor-borda)}

/* ─── SOBRE ─── */
.sobre-card{background:var(--cor-fundo-card);border-radius:var(--raio-grande);padding:36px;box-shadow:var(--sombra-card);border:1px solid var(--cor-borda-light)}
.sobre-texto{font-size:.95rem;color:var(--cor-texto-light);line-height:1.9;margin-bottom:28px}
.sobre-destaques{display:flex;flex-wrap:wrap;gap:10px}
.sobre-destaque{display:inline-flex;align-items:center;gap:8px;background:var(--cor-fundo-alt);border:1px solid var(--cor-borda);padding:10px 18px;border-radius:var(--raio-pill);font-size:.82rem;font-weight:700;color:var(--cor-texto);transition:var(--trans)}
.sobre-destaque:hover{border-color:var(--cor-primaria);background:var(--cor-primaria-light);color:var(--cor-primaria)}
.sobre-destaque-icon{font-size:1.1rem}

/* ─── PROJETOS (GALERIA CRIATIVA) ─── */
.projetos-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.projeto-card{background:var(--cor-fundo-card);border-radius:var(--raio-grande);overflow:hidden;box-shadow:var(--sombra-card);border:1px solid var(--cor-borda-light);transition:var(--trans)}
.projeto-card:hover{transform:translateY(-6px);box-shadow:var(--sombra-card-hover)}
.projeto-capa{height:150px;display:flex;align-items:center;justify-content:center;background:var(--cor-primaria-gradient);position:relative;overflow:hidden}
.projeto-capa img{width:100%;height:100%;object-fit:cover}
.projeto-capa-icon{font-size:2.6rem}
.projeto-categoria{position:absolute;top:12px;left:12px;background:rgba(255,255,255,0.92);color:var(--cor-primaria);font-size:.68rem;font-weight:800;padding:5px 12px;border-radius:var(--raio-pill);text-transform:uppercase;letter-spacing:.5px}
.projeto-corpo{padding:20px}
.projeto-titulo{font-size:1.05rem;font-weight:800;color:var(--cor-texto);margin-bottom:8px}
.projeto-desc{font-size:.84rem;color:var(--cor-texto-light);line-height:1.7;margin-bottom:14px}
.projeto-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.projeto-tag{font-size:.68rem;font-weight:700;background:var(--cor-primaria-light);color:var(--cor-primaria);padding:4px 10px;border-radius:var(--raio-pill)}
.projeto-link{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--cor-primaria)}

/* ─── EXPERIÊNCIA ─── */
.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--cor-borda)}
.timeline-item{position:relative;margin-bottom:32px}
.timeline-item:last-child{margin-bottom:0}
.timeline-dot{position:absolute;left:-32px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--cor-primaria-light);border:3px solid var(--cor-primaria);z-index:1;transition:var(--trans)}
.timeline-item:hover .timeline-dot{background:var(--cor-primaria);box-shadow:0 0 0 5px var(--cor-primaria-light)}
.timeline-card{background:var(--cor-fundo-card);border-radius:var(--raio);padding:24px 28px;box-shadow:var(--sombra-sutil);border:1px solid var(--cor-borda-light);transition:var(--trans)}
.timeline-card:hover{box-shadow:var(--sombra-card);border-color:rgba(var(--cor-primaria-rgb),0.2);transform:translateX(4px)}
.timeline-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.timeline-cargo{font-size:1.05rem;font-weight:800;color:var(--cor-texto)}
.timeline-periodo{font-size:.75rem;font-weight:700;color:var(--cor-primaria);background:var(--cor-primaria-light);padding:4px 12px;border-radius:var(--raio-pill);white-space:nowrap}
.timeline-empresa{font-size:.88rem;font-weight:600;color:var(--cor-texto-light);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.timeline-empresa-icon{font-size:1rem}
.timeline-desc{font-size:.85rem;color:var(--cor-texto-light);line-height:1.7}
.timeline-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.timeline-tag{font-size:.7rem;font-weight:600;background:var(--cor-fundo-alt);color:var(--cor-texto-muted);padding:4px 10px;border-radius:var(--raio-pill);border:1px solid var(--cor-borda)}

/* ─── FORMAÇÃO ─── */
.formacao-grid{display:flex;flex-direction:column;gap:16px}
.formacao-card{display:flex;align-items:center;gap:20px;background:var(--cor-fundo-card);border-radius:var(--raio);padding:24px;box-shadow:var(--sombra-sutil);border:1px solid var(--cor-borda-light);transition:var(--trans)}
.formacao-card:hover{box-shadow:var(--sombra-card);border-color:rgba(var(--cor-primaria-rgb),0.2)}
.formacao-icone{width:56px;height:56px;border-radius:14px;background:var(--cor-primaria-light);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
.formacao-info{flex:1}
.formacao-curso{font-size:1rem;font-weight:800;color:var(--cor-texto);margin-bottom:2px}
.formacao-instituicao{font-size:.85rem;color:var(--cor-texto-light);display:flex;align-items:center;gap:4px}
.formacao-ano{font-size:.75rem;font-weight:700;color:var(--cor-primaria);background:var(--cor-primaria-light);padding:4px 12px;border-radius:var(--raio-pill);white-space:nowrap;flex-shrink:0}

/* ─── HABILIDADES ─── */
.hab-modos{display:flex;gap:8px;margin-bottom:24px}
.hab-modo-btn{padding:8px 18px;border-radius:var(--raio-pill);font-size:.8rem;font-weight:700;border:2px solid var(--cor-borda);background:transparent;color:var(--cor-texto-light);cursor:pointer;transition:var(--trans)}
.hab-modo-btn.active{background:var(--cor-primaria);color:white;border-color:var(--cor-primaria)}
.hab-modo-btn:hover:not(.active){border-color:var(--cor-primaria);color:var(--cor-primaria)}
.hab-barras{display:flex;flex-direction:column;gap:18px}
.hab-barra-item{background:var(--cor-fundo-card);border-radius:var(--raio);padding:18px 22px;box-shadow:var(--sombra-sutil);border:1px solid var(--cor-borda-light)}
.hab-barra-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hab-barra-nome{font-size:.9rem;font-weight:700;color:var(--cor-texto)}
.hab-barra-pct{font-size:.8rem;font-weight:800;color:var(--cor-primaria)}
.hab-barra-track{width:100%;height:var(--barra-altura);background:var(--cor-barra-fundo);border-radius:var(--barra-raio);overflow:hidden}
.hab-barra-fill{height:100%;border-radius:var(--barra-raio);background:var(--cor-primaria-gradient);transition:width 1.2s cubic-bezier(0.4,0,0.2,1)}
.hab-tags{display:flex;flex-wrap:wrap;gap:10px}
.hab-tag{display:inline-flex;align-items:center;gap:8px;background:var(--cor-fundo-card);border:2px solid var(--cor-borda);padding:12px 20px;border-radius:var(--raio-pill);font-size:.85rem;font-weight:700;color:var(--cor-texto);transition:var(--trans);cursor:default}
.hab-tag:hover{border-color:var(--cor-primaria);background:var(--cor-primaria-light);color:var(--cor-primaria);transform:translateY(-2px)}
.hab-tag-icon{font-size:1.1rem}
.hab-tag-nivel{font-size:.65rem;font-weight:800;background:var(--cor-primaria-light);color:var(--cor-primaria);padding:3px 8px;border-radius:var(--raio-pill)}

/* ─── CONTATO ─── */
.contato-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.contato-card{display:flex;align-items:center;gap:16px;background:var(--cor-fundo-card);border-radius:var(--raio);padding:22px;box-shadow:var(--sombra-sutil);border:1px solid var(--cor-borda-light);transition:var(--trans)}
.contato-card:hover{box-shadow:var(--sombra-card);border-color:rgba(var(--cor-primaria-rgb),0.2)}
.contato-card-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.contato-card-icon.wpp{background:rgba(37,211,102,0.12)}
.contato-card-icon.tel{background:var(--cor-primaria-light)}
.contato-card-icon.email{background:var(--cor-accent-light)}
.contato-card-icon.local{background:#EDE4FF}
.contato-label{font-size:.7rem;color:var(--cor-texto-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.contato-valor{font-size:.92rem;font-weight:700;color:var(--cor-texto)}
.contato-btns{display:flex;gap:12px;flex-wrap:wrap}

/* ─── FOOTER ─── */
.footer{background:var(--cor-fundo-escuro);color:rgba(255,255,255,0.6);text-align:center;padding:44px 24px 32px;font-size:.82rem}
.footer a{color:rgba(255,255,255,0.85);font-weight:700}
.footer-social{display:flex;justify-content:center;gap:14px;margin-bottom:18px}
.footer-social a{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:var(--trans)}
.footer-social a:hover{background:var(--cor-primaria-gradient);transform:translateY(-3px)}

/* ─── WHATSAPP FLUTUANTE ─── */
.wpp-float{position:fixed;bottom:24px;right:24px;z-index:900;display:flex;align-items:center;gap:10px}
.wpp-float-msg{background:white;color:var(--cor-texto);padding:10px 16px;border-radius:var(--raio-pill);font-size:.8rem;font-weight:700;box-shadow:var(--sombra-card);white-space:nowrap;animation:float-in .4s ease}
@keyframes float-in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
.wpp-float-btn{width:58px;height:58px;border-radius:50%;background:var(--cor-whatsapp);display:flex;align-items:center;justify-content:center;font-size:1.7rem;box-shadow:0 6px 20px rgba(37,211,102,0.5);transition:var(--trans);flex-shrink:0}
.wpp-float-btn:hover{background:var(--cor-whatsapp-hover);transform:scale(1.08)}

/* ─── RESPONSIVO ─── */
@media (max-width:640px){
  .hero-nome{font-size:2.1rem}
  .contato-grid,.projetos-grid{grid-template-columns:1fr}
  .nav-links{display:none}
  .hero-info-bar{gap:24px}
  .secao{padding:56px 0}
}
</style>

function getWppLink() {
  return `https://wa.me/${CONFIG.pessoal.whatsapp}?text=${encodeURIComponent(CONFIG.pessoal.whatsappMensagem)}`;
}

// ─── NAVBAR ───
function Navbar() {
  const [solid, setSolid] = React.useState(false);
  React.useEffect(() => {
    const fn = () => setSolid(window.scrollY > 80);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  return (
    <nav className={`nav ${solid ? 'solid' : ''}`}>
      <div className="nav-inner">
        <div className="nav-name">
          <span className="nav-name-dot"></span>
          {CONFIG.pessoal.nome.split(' ')[0]} {CONFIG.pessoal.nome.split(' ').slice(-1)[0]}
        </div>
        <div className="nav-links">
          <a href="#sobre" className="nav-link">Sobre</a>
          <a href="#projetos" className="nav-link">Projetos</a>
          <a href="#experiencia" className="nav-link">Experiência</a>
          <a href="#habilidades" className="nav-link">Habilidades</a>
          <a href="#contato" className="nav-link">Contato</a>
        </div>
        <a href="#contato" className="nav-cta">
          <span>✉️</span>
          <span>Contato</span>
        </a>
      </div>
    </nav>
  );
}

// ─── PROJETOS ───

          ))}
        </div>
        <div className="secao-divider" style={{marginTop:'var(--secao-padding)'}}></div>
      </div>
    </section>
  );
}

// ─── HABILIDADES ───
function Habilidades() {
  const habs = CONFIG.habilidades;
  const [modo, setModo] = React.useState(CONFIG.habilidadesModoInicial || 'barras');
  const [animado, setAnimado] = React.useState(false);

  React.useEffect(() => {
    const obs = new IntersectionObserver(
      (entries) => { if (entries[0].isIntersecting) setAnimado(true); },
      { threshold: 0.2 }
    );
    const el = document.getElementById('habilidades');
    if (el) obs.observe(el);
    return () => obs.disconnect();
  }, []);

  if (!habs || habs.length === 0) return null;

  return (
    <section className="secao" id="habilidades" style={{paddingTop:0}}>
      <div className="main-container">
        <div className="secao-titulo">
          <span className="secao-titulo-label">⚡ Skills</span>
          <h2>Habilidades</h2>
          <p>Ferramentas e competências que domino</p>
        </div>

        <div className="hab-modos">
          <button className={`hab-modo-btn ${modo === 'barras' ? 'active' : ''}`} onClick={() => setModo('barras')}>📊 Barras</button>
          <button className={`hab-modo-btn ${modo === 'tags' ? 'active' : ''}`} onClick={() => setModo('tags')}>🏷️ Tags</button>
        </div>

        {modo === 'barras' ? (
          <div className="hab-barras">
            {habs.map((h, i) => (
              <div className="hab-barra-item" key={i}>
                <div className="hab-barra-header">
                  <span className="hab-barra-nome">{h.icone} {h.nome}</span>
                  <span className="hab-barra-pct">{h.nivel}%</span>
                </div>
                <div className="hab-barra-track">
                  <div className="hab-barra-fill" style={{ width: animado ? `${h.nivel}%` : '0%' }}></div>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div className="hab-tags">
            {habs.map((h, i) => (
              <span className="hab-tag" key={i}>
                <span className="hab-tag-icon">{h.icone}</span>
                {h.nome}
                <span className="hab-tag-nivel">{h.nivelTexto}</span>
              </span>
            ))}
          </div>
        )}

        <div className="secao-divider" style={{marginTop:'var(--secao-padding)'}}></div>
      </div>
    </section>
  );
}

// ─── CONTATO ───
function Contato() {
  const p = CONFIG.pessoal;

  return (
    <section className="secao" id="contato" style={{paddingTop:0}}>
      <div className="main-container">
        <div className="secao-titulo">
          <span className="secao-titulo-label">📬 Contato</span>
          <h2>Vamos criar juntos?</h2>
          <p>Ficarei feliz em conversar sobre seu próximo projeto</p>
        </div>

        <div className="contato-grid">
          <div className="contato-card">
            <div className="contato-card-icon wpp">📱</div>
            <div>
              <div className="contato-label">WhatsApp</div>
              <div className="contato-valor">{p.telefone}</div>
            </div>
          </div>
          <div className="contato-card">
            <div className="contato-card-icon tel">📞</div>
            <div>
              <div className="contato-label">Telefone</div>
              <div className="contato-valor">{p.telefone}</div>
            </div>
          </div>
          <div className="contato-card">
            <div className="contato-card-icon email">✉️</div>
            <div>
              <div className="contato-label">E-mail</div>
              <div className="contato-valor" style={{fontSize:'.82rem'}}>{p.email}</div>
            </div>
          </div>
          <div className="contato-card">
            <div className="contato-card-icon local">📍</div>
            <div>
              <div className="contato-label">Localização</div>
              <div className="contato-valor">{p.cidade}</div>
            </div>
          </div>
        </div>

        <div className="contato-btns">
          <a href={getWppLink()} target="_blank" rel="noopener noreferrer" className="btn-wpp">
            <span>📲</span> Chamar no WhatsApp
          </a>
          <a href={`mailto:${p.email}`} className="btn-primary">
            <span>✉️</span> Enviar E-mail
          </a>
          {p.curriculoPDF && (
            <a href={p.curriculoPDF} download className="btn-download">
              <span>📄</span> Baixar Portfólio PDF
            </a>
          )}
        </div>
      </div>
    </section>
  );
}

// ─── FOOTER ───
function Footer() {
  const ano = new Date().getFullYear();
  const p = CONFIG.pessoal;
  const redes = [
    { url: p.linkedin, icone: '💼', label: 'LinkedIn' },
    { url: p.github, icone: '💻', label: 'GitHub' },
    { url: p.instagram, icone: '📸', label: 'Instagram' },
  ];
  const temRedes = redes.some(r => r.url);

  return (
    <footer className="footer">
      {temRedes && (
        <div className="footer-social">
          {redes.map((r, i) => {
            if (!r.url) return null;
            return (
              <a key={i} href={r.url} target="_blank" rel="noopener noreferrer" title={r.label}>
                {r.icone}
              </a>
            );
          })}
        </div>
      )}
      <p>© {ano} <a href="#inicio">{p.nome}</a></p>
      <p style={{marginTop:'4px',fontSize:'.72rem',opacity:.5}}>
        Portfólio online • {p.profissao}
      </p>
    </footer>
  );
}

// ─── WPP FLUTUANTE ───
function WppFloat() {
  const [show, setShow] = React.useState(false);
  React.useEffect(() => {
    const t = setTimeout(() => setShow(true), 2500);
    return () => clearTimeout(t);
  }, []);
  if (!show) return null;

  return (
    <div className="wpp-float">
      <div className="wpp-float-msg">💬 Fale comigo!</div>
      <a href={getWppLink()} target="_blank" rel="noopener noreferrer" className="wpp-float-btn" aria-label="WhatsApp">
        📱
      </a>
    </div>
  );
}

// ─── APP ───
function App() {
  return (
    <div>
      <Navbar />
      <Hero />
      <Sobre />
      <Projetos />
      <Experiencia />
      <Formacao />
      <Habilidades />
      <Contato />
      <Footer />
      <WppFloat />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
